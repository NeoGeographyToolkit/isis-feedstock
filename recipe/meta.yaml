{% set version = "10.0.0" %}

package:
  name: isis
  version: {{ version }}

# ASP build: source = OUR fork oleg-alexandrov/ISIS3, branch try_5955 = PR
# DOI-USGS/ISIS3#6046 (rebased on dev) @ 4f24a9ac5. Carries Chandrayaan-2
# non-nadir + KPLO ShadowCam, beyond what USGS has published. NOT upstream.
source:
  git_url: https://github.com/oleg-alexandrov/ISIS3.git
  git_rev: 4f24a9ac5e51c736ba8822f9e3402ea26c721405

build:
  number: 5
  string: asp_5_{{ target_platform | replace("-", "_") }}          # glibc floor fix (re-add stdlib pin)
  skip: true  # [win]

# Deps PINNED HARD to isis_dev's exact versions (Oleg) so the built isis
# installs cleanly into isis_dev (private channel, no external conflict). This
# is the ISIS 10.x environment.yml spec, minus docs/test/coverage tools
# (barebones: no tests, no docs, no JP2/Kakadu) and with our asp
# ale/usgscsm/spiceql. Non-arm deps (mkl, mysql-connector-c, xalan-c) marked
# # [not arm64] = linux + osx-64 (ISIS environment.yml has them; only
# environment_arm.yml drops them). armadillo/highfive pinned per-arch.
requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake >=3.27,<3.28
    - ninja >=1.10,<1.11
    - make
    - swig
    - doxygen   # ISIS CMakeLists.txt find_program(DOXYGEN) is REQUIRED even with buildDocs=OFF
  host:
    - ale =1.2.0=asp*                 # our asp build (channel priority picks asp_*)
    - usgscsm =2.0.2=asp*             # our asp build
    - spiceql =1.3.0=asp*             # our asp build
    - aom
    - armadillo 15.2.3          # [arm64]
    - armadillo 15.2.7          # [osx and x86_64]
    - armadillo 15.2.7          # [linux]
    - blas
    # aarch64: force openblas - conda-forge default blas here is blis, whose
    # aarch64 2.0 build aborts at runtime in a virtualized VM (bli_gks.c MC/MR).
    - libblas * *openblas*      # [aarch64]
    - liblapack * *openblas*    # [aarch64]
    - bullet 3.25
    - bz2file
    - bzip2
    - cspice 67
    - csm 3.0.3.3
    - curl >=8.14.1,<9
    - eigen 3.4.0
    - embree 3.13.0
    - ffmpeg
    - geos 3.14.1
    - geotiff
    - gdal 3.12.2
    - libgdal 3.12.2
    - gmp
    - conda-forge::gsl >=2.6,<2.7
    - hdf5 1.14.6
    - highfive 3.2.0            # [arm64]
    - highfive 3.3.0            # [osx and x86_64]
    - highfive 3.3.0            # [linux]
    - icu
    - inja 3.5.0
    - jama
    - kalasiris
    - krb5
    - libboost 1.88.0
    - libopencv 4.12.0
    - libpng >=1.6.34,<1.7
    - libprotobuf 6.31.1
    - libtiff >=4.5,<4.8
    - libvulkan-headers
    - libxml2
    - mesalib
    # linux Qt6/OpenGL needs the EGL/GL dev headers (OPENGL_EGL_INCLUDE_DIR);
    # osx uses a different GL path so it does not need these.
    - libgl-devel               # [linux]
    - libegl-devel              # [linux]
    - libopengl-devel           # [linux]
    - mkl                       # [not (arm64 or aarch64)]
    - mysql
    - mysql-connector-c         # [not (arm64 or aarch64)]
    - nanoflann >=1.4.2,<1.5
    - nlohmann_json =3.11.2
    - nn                        # [not aarch64]
    # aarch64: our nasa-channel nn h920789f_2003 is NON-PIC (triangle.o uses
    # direct ADRP for global plus1mod3/minus1mod3) and breaks the libisis.so
    # link. conda-forge's h86ecc28_2003 is PIC (GOT-indirect). Pin to it.
    - nn 1.86.0 h86ecc28_2003   # [aarch64]
    - minizip =4.0.10
    - opencv 4.12.0
    - openssl >=3.5,<4
    - pcl 1.15.1
    - pdal >=2.8.4,<3
    - plio >=1.6.3
    - protobuf 6.31.1
    - python 3.13
    - qhull
    - qt6-main 6.10.2
    - qt6-multimedia
    - qwt =6.3.0
    - spiceypy >=6,<7
    - sqlite >=3.46.0,<4
    - suitesparse <7.7.0
    - superlu
    - tnt
    - x264
    - xalan-c >=1.12,<1.13      # [not (arm64 or aarch64)]
    - xerces-c >=3.3.0,<3.4
  run:
    # most shared libs come via host run_exports; list our asp packages + the
    # runtime essentials + things without run_exports.
    - ale =1.2.0=asp*
    - usgscsm =2.0.2=asp*
    - spiceql =1.3.0=asp*
    - cspice 67
    - csm 3.0.3.3
    - python 3.13
    - spiceypy >=6,<7

test:
  commands:
    - test -e $PREFIX/bin/isisimport && ls $PREFIX/lib/libisis*${SHLIB_EXT}   # [unix] (lib is libisis10.dylib, not libisis.dylib)
    - test -e $PREFIX/include/isis/Isis.h        # [unix]
    - test -e $PREFIX/bin/isisimport             # [unix]

about:
  home: https://github.com/DOI-USGS/ISIS3
  license: CC0-1.0
  summary: USGS ISIS, ASP build (PR #6046 - Chandrayaan-2 non-nadir + KPLO ShadowCam)
  dev_url: https://github.com/DOI-USGS/ISIS3

extra:
  recipe-maintainers:
    - oleg-alexandrov
